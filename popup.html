<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Read Aloud Settings</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --bg-light: #313244;
      --accent: #cba6f7;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --border: #45475a;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .control-group {
      margin-bottom: 16px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .value-display {
      color: var(--accent);
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-light);
      color: var(--text);
      font-size: 14px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus, select:hover {
      border-color: var(--accent);
    }
    /* Sliders */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: var(--bg-light);
      border-radius: 3px;
      border: 1px solid var(--border);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(203, 166, 247, 0.4);
      transition: transform 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    
    /* Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding: 12px;
      background: var(--bg-light);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .toggle-container label {
      margin: 0;
      color: var(--text);
      font-size: 14px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--accent);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn-test {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      margin-top: 15px;
      width: 100%;
    }
    #btn-test:hover {
      background-color: rgba(203, 166, 247, 0.1);
    }
    #btn-read {
      background-color: var(--accent);
      color: var(--bg);
    }
    #btn-read:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    #btn-stop {
      background-color: var(--bg-light);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #btn-stop:hover {
      background-color: #45475a;
    }
  </style>
</head>
<body>
  <h2>Read Aloud</h2>

  <div class="control-group">
    <label for="voice-select">Voice</label>
    <select id="voice-select">
      <option value="">Loading voices...</option>
    </select>
  </div>

  <div class="control-group">
    <label for="rate-range">Speed <span id="rate-value" class="value-display">1.0x</span></label>
    <input type="range" id="rate-range" min="0.5" max="2.0" step="0.1" value="1.0">
  </div>

  <div class="control-group">
    <label for="volume-range">Volume <span id="volume-value" class="value-display">100%</span></label>
    <input type="range" id="volume-range" min="0" max="1" step="0.1" value="1.0">
  </div>
  
  <button id="btn-test">Test Voice</button>

  <div class="toggle-container">
    <label for="auto-read-check">Auto-read on select</label>
    <label class="switch">
      <input type="checkbox" id="auto-read-check">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-container" style="margin-top: 10px;">
    <label for="auto-pause-check">Auto-pause on tab switch</label>
    <label class="switch">
      <input type="checkbox" id="auto-pause-check">
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-row">
    <button id="btn-read">Read Page</button>
    <button id="btn-stop">Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
